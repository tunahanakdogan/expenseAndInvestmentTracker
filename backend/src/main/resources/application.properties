spring.application.name=finans
# Lokal geliştirmede kök dizindeki .env okunur; prod'da ortam değişkenleri kullanılır.
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Instant kolonları düz TIMESTAMP, değerler UTC olarak saklanır.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

app.jwt.secret=${JWT_SECRET}
app.jwt.ttl=P7D
# Tek kullanıcı: tabloda kullanıcı yoksa bu bilgilerle ilk açılışta oluşturulur.
app.initial-user.username=${APP_USERNAME:}
app.initial-user.password=${APP_PASSWORD:}
